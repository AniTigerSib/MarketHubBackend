spring.application.name=listing-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/listings
spring.datasource.username=listing_service
spring.datasource.password=listing_service

# Access tokens are verified locally with auth-service's public keys
markethub.security.jwk-set-uri=${JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
markethub.security.issuer=markethub-auth
