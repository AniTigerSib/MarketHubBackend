spring.application.name=listing-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/listings
spring.datasource.username=listing_service
spring.datasource.password=listing_service

# Access tokens are verified locally with auth-service's public keys
markethub.security.jwk-set-uri=${JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
markethub.security.issuer=markethub-auth

# Documentation is opt-in for the development landscape.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Shared category response cache. Redis entries expire 60 seconds after population.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=listing-service
spring.data.redis.password=listing_service
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
spring.data.redis.repositories.enabled=false
