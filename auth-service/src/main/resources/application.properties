spring.application.name=auth-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/auth
spring.datasource.username=auth_service
spring.datasource.password=auth_service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Must match what resource servers expect in the "iss" claim
markethub.jwt.issuer=markethub-auth
markethub.jwt.access-token-ttl=15m
markethub.jwt.refresh-token-ttl=30d
