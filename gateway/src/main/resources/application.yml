spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/users/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/auth/**
            - id: listing-service
              uri: ${LISTING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/listings/**,/categories/**,/cities/**,/favorites/**

server:
  port: 8080
