spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/users/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/auth/**
            - id: listing-service
              uri: ${LISTING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/listings/**,/categories/**,/cities/**,/favorites/**

  data:
    redis:
      # Docker sets host, username and password (docker/redis/users.acl)
      host: localhost
      port: 6379
      username: gateway
      password: gateway
      # Short: every request with a token waits for Redis. On failure the gateway skips
      # Redis for 5 s and lets tokens through unchecked (see docs/ARCHITECTURE.md, gateway).
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false

server:
  port: 8080

markethub:
  cors:
    # Comma-separated exact origins of the web UI (Vite dev server and `vite preview` by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    max-age: 1h
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Per client IP. Allowance refills gradually over the window.
    rules:
      - name: login
        method: POST
        path: /auth/login
        capacity: 10
        window: 1m
      - name: register
        method: POST
        path: /auth/register
        capacity: 5
        window: 15m
      - name: refresh
        method: POST
        path: /auth/refresh
        capacity: 30
        window: 1m
