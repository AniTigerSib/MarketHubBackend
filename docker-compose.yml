services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      # For services started outside Docker (e.g. from the IDE)
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Access-token blacklist (written by auth-service, read by the gateway) and the gateway's
  # rate-limit counters. Users and permissions: docker/redis/users.acl
  redis:
    image: redis:8.2
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/usr/local/etc/redis/users.acl"]
    ports:
      # For services started outside Docker (e.g. from the IDE)
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user auth-service --pass auth_service --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One database per service; neither service can read the other's tables
  user-db:
    image: postgres:18.1
    ports:
      # For services started outside Docker (e.g. from the IDE)
      - "5433:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d users"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-db:
    image: postgres:18.1
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth"]
      interval: 5s
      timeout: 5s
      retries: 20

  listing-db:
    image: postgres:18.1
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: listings
      POSTGRES_USER: listing_service
      POSTGRES_PASSWORD: listing_service
    volumes:
      - listing-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listing_service -d listings"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      LISTING_SERVICE_URL: http://listing-service:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: gateway
      SPRING_DATA_REDIS_PASSWORD: gateway
    depends_on:
      - user-service
      - auth-service
      - listing-service

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: user_service
      SPRING_DATASOURCE_PASSWORD: user_service
      # Public keys for verifying access tokens; fetched lazily, so auth-service may start later
      JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      kafka:
        condition: service_healthy
      user-db:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_service
      SPRING_DATASOURCE_PASSWORD: auth_service
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: auth-service
      SPRING_DATA_REDIS_PASSWORD: auth_service
    depends_on:
      kafka:
        condition: service_healthy
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  listing-service:
    build:
      context: .
      args:
        SERVICE: listing-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://listing-db:5432/listings
      SPRING_DATASOURCE_USERNAME: listing_service
      SPRING_DATASOURCE_PASSWORD: listing_service
      JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      listing-db:
        condition: service_healthy

volumes:
  user-db-data:
  auth-db-data:
  listing-db-data:
  redis-data:
