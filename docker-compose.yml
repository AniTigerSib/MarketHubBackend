services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      # For services started outside Docker (e.g. from the IDE)
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One database per service; neither service can read the other's tables
  user-db:
    image: postgres:18.1
    ports:
      # For services started outside Docker (e.g. from the IDE)
      - "5433:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d users"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-db:
    image: postgres:18.1
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
    depends_on:
      - user-service
      - auth-service

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: user_service
      SPRING_DATASOURCE_PASSWORD: user_service
      # Public keys for verifying access tokens; fetched lazily, so auth-service may start later
      JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      kafka:
        condition: service_healthy
      user-db:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_service
      SPRING_DATASOURCE_PASSWORD: auth_service
    depends_on:
      kafka:
        condition: service_healthy
      auth-db:
        condition: service_healthy

volumes:
  user-db-data:
  auth-db-data:
