spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/users
spring.datasource.username=user_service
spring.datasource.password=user_service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.worfwint.markethub.user.events.UserRegistered

# Access tokens are verified locally with auth-service's public keys
markethub.security.jwk-set-uri=${JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
markethub.security.issuer=markethub-auth
